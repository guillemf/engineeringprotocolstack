title: "The Engineering Protocol Stack"
tagline: "A Layered Model for Engineering Leadership"
description: >-
  A book by Guillem Fernandez that maps the human side of engineering
  leadership onto the layers of a computer system — CPU, LAN and WAN —
  so the "soft" parts of the job finally get a clear, usable structure.

# Site-wide default social-share image for jekyll-seo-tag (og:image /
# twitter:image). Individual pages can override this by setting their own
# `image:` in front matter — see about.md, which uses the author photo.
image: /assets/images/book-cover.jpg

default_lang: en
languages: [en, es]

author:
  name: "Guillem Fernandez"
  bio: "Engineering Director, People Engineer, and author of The Engineering Protocol Stack."
  email: hello@guillem.cat
  website: https://pro.guillem.cat
  linkedin: https://www.linkedin.com/in/gfernandezg
  github: https://github.com/guillemf
  youtube: https://www.youtube.com/@guillemefege
  engineeringprotocolstack: https://engineeringprotocolstack.com

book:
  buy_url: "https://leanpub.com/engineeringprotocolstack"
  cover_image: /assets/images/book-cover.jpg

# Where the Trustline installers linked from /tools/trustline/ actually live.
#
# A separate, public, releases-only repository: the application source is
# private, and GitHub will not serve release assets from a private repository to
# anonymous visitors. This repository holds no code — only the built installers.
#
# `version` has to match the version in the app's Cargo.toml, because the Tauri
# bundler puts it in every filename and `releases/latest/download/<file>` is an
# exact-filename URL. The release workflow refuses to build a tag that disagrees
# with the manifest, so the two cannot silently drift; a new release means
# bumping this one line.
#
# The `file` values are what the bundler produces for each platform, and the
# `id` keys match the `downloads` map in _data/tools.yml, which supplies the
# label and system requirement shown next to each button.
trustline:
  version: "0.2.0"
  releases_repo: "guillemf/trustline-releases"
  # The download counter on /tools/trustline/ is rendered only once the total in
  # _data/trustline_downloads.yml reaches this number. A visible count is social
  # proof, and social proof in the low hundreds argues the opposite of what it is
  # there to argue — so the counter stays hidden until it helps rather than
  # advertising how new the product is. Set to 0 to show the number whatever it
  # is; the counts themselves are refreshed daily either way.
  downloads_min_display: 250
  downloads:
    - id: macos
      file: "Trustline_0.2.0_universal.dmg"
    - id: windows
      file: "Trustline_0.2.0_x64-setup.exe"
    - id: linux_appimage
      file: "Trustline_0.2.0_amd64.AppImage"
    - id: linux_deb
      file: "Trustline_0.2.0_amd64.deb"

# Base URL of the platform API that powers the dynamic self-assessment
# quiz on /assessment/. Must be HTTPS in production — the site itself is
# served over HTTPS, and browsers block an HTTPS page from fetching
# plain-http resources ("mixed content"), which is why a bare IP does not
# work here even with CORS enabled.
#
# This URL is not questions_svc directly — it is router_svc, the API
# gateway that sits behind api.engineeringprotocolstack.com (Caddy
# reverse proxy with automatic Let's Encrypt TLS) and forwards
# `/questions?...` on to questions_svc unchanged. See the sibling
# `router_svc` and `questions_svc` repositories (outside this Jekyll
# repo, under "Engineering Protocol Stack") for how that's deployed.
#
# For local development (`jekyll serve` + `cargo run` on the same
# machine), temporarily point this back at "http://localhost:8080" and
# run questions_svc directly — no gateway needed for local testing.
assessment_service:
  base_url: "https://api.engineeringprotocolstack.com"

# Same platform API gateway as assessment_service.base_url above, used by
# the "book a consultation" widget (/consultation/, /es/consulta/) to talk
# to calendar_svc via router_svc's /calendar/... routes. Kept as its own
# setting (rather than reusing assessment_service.base_url) so future
# per-feature base URLs stay independently overridable, even though today
# they resolve to the same gateway.
platform_api:
  base_url: "https://api.engineeringprotocolstack.com"

url: "https://engineeringprotocolstack.com"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /posts/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      lang: "en"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      lang: "en"
  - scope:
      path: "es"
    values:
      lang: "es"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - questions_svc
  - deploy
