title: "The Engineering Protocol Stack"
tagline: "A Layered Model for Engineering Leadership"
description: >-
  A book by Guillem Fernandez that maps the human side of engineering
  leadership onto the layers of a computer system — CPU, RAM, LAN and WAN —
  so the "soft" parts of the job finally get a clear, usable structure.

default_lang: en
languages: [en, es]

author:
  name: "Guillem Fernandez"
  bio: "Engineering Director, People Engineer, and author of The Engineering Protocol Stack."
  email: hello@guillem.cat
  website: https://pro.guillem.cat
  linkedin: https://www.linkedin.com/in/gfernandezg
  github: https://github.com/guillemf
  engineeringprotocolstack: https://www.engineeringprotocolstack.com

book:
  buy_url: "https://leanpub.com/engineeringprotocolstack"
  cover_image: /assets/images/book-cover.jpg

# Base URL of the questions_svc microservice that powers the dynamic
# self-assessment quiz on /assessment/. Must be HTTPS in production — the
# site itself is served over HTTPS, and browsers block an HTTPS page from
# fetching plain-http resources ("mixed content"), which is why a bare IP
# like http://16.171.32.190 does not work here even with CORS enabled.
# See deploy/questions_svc/README.md for how api.engineeringprotocolstack.com
# is set up (Caddy reverse proxy with automatic Let's Encrypt TLS) — update
# this value once that DNS record + Caddy are live.
#
# For local development (`jekyll serve` + `cargo run` on the same
# machine), temporarily point this back at "http://localhost:8080".
assessment_service:
  base_url: "https://api.engineeringprotocolstack.com"

url: "https://www.engineeringprotocolstack.com"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /posts/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      lang: "en"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      lang: "en"
  - scope:
      path: "es"
    values:
      lang: "es"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - questions_svc
  - deploy
