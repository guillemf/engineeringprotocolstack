title: "The Engineering Protocol Stack"
tagline: "A Layered Model for Engineering Leadership"
description: >-
  A book by Guillem Fernandez that maps the human side of engineering
  leadership onto the layers of a computer system — CPU, RAM, LAN and WAN —
  so the "soft" parts of the job finally get a clear, usable structure.

default_lang: en
languages: [en, es]

author:
  name: "Guillem Fernandez"
  bio: "Engineering Director, People Engineer, and author of The Engineering Protocol Stack."
  email: hello@guillem.cat
  website: https://pro.guillem.cat
  linkedin: https://www.linkedin.com/in/gfernandezg
  github: https://github.com/guillemf
  engineeringprotocolstack: https://www.engineeringprotocolstack.com

book:
  buy_url: "https://leanpub.com/engineeringprotocolstack"
  cover_image: /assets/images/book-cover.jpg

# Base URL of the platform API that powers the dynamic self-assessment
# quiz on /assessment/. Must be HTTPS in production — the site itself is
# served over HTTPS, and browsers block an HTTPS page from fetching
# plain-http resources ("mixed content"), which is why a bare IP does not
# work here even with CORS enabled.
#
# This URL is not questions_svc directly — it is router_svc, the API
# gateway that sits behind api.engineeringprotocolstack.com (Caddy
# reverse proxy with automatic Let's Encrypt TLS) and forwards
# `/questions?...` on to questions_svc unchanged. See the sibling
# `router_svc` and `questions_svc` repositories (outside this Jekyll
# repo, under "Engineering Protocol Stack") for how that's deployed.
#
# For local development (`jekyll serve` + `cargo run` on the same
# machine), temporarily point this back at "http://localhost:8080" and
# run questions_svc directly — no gateway needed for local testing.
assessment_service:
  base_url: "https://api.engineeringprotocolstack.com"

# Same platform API gateway as assessment_service.base_url above, used by
# the "book a consultation" widget (/consultation/, /es/consulta/) to talk
# to calendar_svc via router_svc's /calendar/... routes. Kept as its own
# setting (rather than reusing assessment_service.base_url) so future
# per-feature base URLs stay independently overridable, even though today
# they resolve to the same gateway.
platform_api:
  base_url: "https://api.engineeringprotocolstack.com"

url: "https://www.engineeringprotocolstack.com"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /posts/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      lang: "en"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      lang: "en"
  - scope:
      path: "es"
    values:
      lang: "es"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - node_modules
  - questions_svc
  - deploy
