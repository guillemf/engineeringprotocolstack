      una versión más nueva. Esa petición no envía nada sobre ti ni sobre tus
      notas, y puedes desactivarla. Nada se sincroniza, nada se analiza y no hay
      telemetría.
    download_title: Descargar
    download_intro: >-
      Gratis, sin cuenta y sin necesidad de dar una dirección de correo. Puede
      que más adelante haya funciones de pago; lo que hay aquí seguirá siendo
      gratuito.
    version_label: Versión
    all_releases: Todas las versiones y notas de publicación
    # See the note on the English keys: %count% is replaced with the total from
    # _data/trustline_downloads.yml.
    downloads_count: "%count% descargas"
    downloads_count_one: "1 descarga"
    downloads:
      macos:
        label: Descargar para macOS
        requirement: Universal · Intel y Apple silicon
      windows:
        label: Descargar para Windows
        requirement: Windows 10 o posterior · 64 bits
      linux_appimage:
        label: Descargar para Linux
        requirement: AppImage · x86_64 · Ubuntu 22.04 o posterior y equivalentes
      linux_deb:
        label: Paquete Debian
        requirement: .deb · Debian 12+, Ubuntu 22.04+ y derivadas
    unsigned_title: El primer arranque necesita un paso extra
    unsigned: >-
      Estas versiones todavía no están firmadas con un certificado de
      desarrollador de pago, así que macOS y Windows avisarán de que no pueden
      verificar al editor. Esto es lo que significa el aviso en la práctica: el
      sistema operativo ve que el archivo no lleva un certificado que reconozca,
      no que haya encontrado nada malo en él. En macOS, haz clic derecho sobre
      la aplicación y elige Abrir, y confirma una vez. En Windows, elige "Más
      información" y después "Ejecutar de todas formas". Los certificados están
      en trámite y los avisos desaparecerán en una versión posterior.
