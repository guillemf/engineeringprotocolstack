# Copy for the dynamic self-assessment quiz at /assessment/ (and /es/assessment/).
#
# The quiz questions themselves are NOT stored here — they are fetched at
# runtime from the questions_svc microservice (see /questions_svc and the
# `assessment_service.base_url` setting in _config.yml). This file only
# holds the page copy and the per-layer / overall scoring copy used once
# the quiz has been answered.
#
# The quiz always draws 10 questions — 3 CPU, 4 LAN, 3 WAN — so results are
# grouped into those same three layers (the book's RAM material lives
# inside the CPU questions here, not as a separate scored layer).

en:
  eyebrow: "Free knowledge check · 2 minutes"
  title: "How well do you actually know The Engineering Protocol Stack?"
  intro: >-
    Ten multiple-choice questions pulled at random from the book itself —
    three from CPU, four from LAN, three from WAN. This isn't a
    self-perception survey: it's a straight knowledge check, scored
    instantly in your browser against a small question service. Answer
    cold; nothing is saved, and no email is required to see your score.
  loading_message: "Loading your questions..."
  network_error_message: "We couldn't reach the question service right now. Make sure it's running and reachable, then try again."
  retry_button: "Try again"
  cta_button: "See my results"
  retake_button: "Take another quiz"
  error_message: "Please answer every question before seeing your results."
  overall_heading: "Your overall score"
  layers_heading: "Layer by layer"
  layers:
    - id: cpu
      tag: CPU
      name: "Focus, Memory & Execution"
      low:
        label: "Fragile"
        text: "You missed most of the CPU questions — the chapters on task switching, memory, process organization, and learning are unlikely to be operating as habits yet. That's exactly the ground Part I of the book, and the 1:1 Engineering Leader Program, are built to cover."
      mid:
        label: "Developing"
        text: "You got some CPU questions right, but there are real gaps in how memory, prioritization, or learning are meant to work in the book's model. A closer re-read of Part I — or a session in the Leader Program — would tighten this up fast."
      high:
        label: "Solid"
        text: "You know this layer cold: task-switching costs, memory techniques, and how the book structures personal process are second nature to you. That foundation is what makes the higher layers sustainable."
      service_label: "1:1 Engineering Leader Program"
      service_url: "/services/#leader-program"
    - id: lan
      tag: LAN
      name: "Team Health"
      low:
        label: "Fragile"
        text: "Most of the LAN questions caught you off guard — the book's models for team roles, career paths, and team management (the five dysfunctions, health checks, feedback) don't seem to have landed yet. That's exactly what a LAN Audit is built to walk through on your actual team, not just the book."
      mid:
        label: "Developing"
        text: "You know the basics of the LAN chapters, but missed some of the specifics — role archetypes, leveling, or team-health mechanics. Worth a re-read, or a focused LAN Audit session on your own team."
      high:
        label: "Solid"
        text: "You have a strong grasp of the book's team-management models — roles, career paths, and the mechanics of team health. The next step is applying that fluency to your own team's specific blind spots."
      service_label: "LAN Audit — Team Health Assessment"
      service_url: "/services/#lan-audit"
    - id: wan
      tag: WAN
      name: "Stakeholders & Organization"
      low:
        label: "Fragile"
        text: "The WAN questions were the toughest for you — stakeholder mapping, cross-team dependencies, and upward management are covered in detail in Part III, and it's worth going back through them before you rely on this instinctively."
      mid:
        label: "Developing"
        text: "You caught some of the WAN material but not all of it — dependency handling or stakeholder-mapping specifics slipped through. A second pass on Part III, or a Team and Leadership Diagnosis, would close the gap."
      high:
        label: "Solid"
        text: "You clearly know how the book structures stakeholder management, dependencies, and upward communication. That's the layer most leaders skip — you didn't."
      service_label: "Team and Leadership Diagnosis"
      service_url: "/services/#team-diagnosis"
  overall:
    low:
      label: "Needs a re-read"
      text: "Right now you know less of the book's model than the quiz assumes — and that's fine, that's what a re-read (or the 1:1 program) is for. Go back through whichever layer scored lowest first; that's usually where the highest-leverage gap is."
    mid:
      label: "Solid grasp, real gaps"
      text: "You clearly know the book — you missed specifics, not the big ideas. Whichever layer scored lowest is worth a closer look before you rely on it under pressure."
    high:
      label: "Sharp recall"
      text: "You know this material well. At this point the highest-leverage move isn't re-reading — it's applying it to your actual team and organization, which is exactly what the services below are for."
  final_cta:
    text: "Whichever layer scored lowest is worth a second look before it costs you in a real situation — let's talk about the fastest way to close that gap."
    button: "Book a free 30-minute intro call →"
    url: "/contact/"

es:
  eyebrow: "Comprobación de conocimiento gratuita · 2 minutos"
  title: "¿Cuánto conoces realmente The Engineering Protocol Stack?"
  intro: >-
    Diez preguntas de opción múltiple extraídas al azar del propio libro —
    tres de CPU, cuatro de LAN, tres de WAN. Esto no es una encuesta de
    autopercepción: es una comprobación de conocimiento real, corregida al
    instante en tu navegador contra un pequeño servicio de preguntas.
    Responde en frío; no se guarda nada, y no necesitas dar tu email para
    ver tu puntuación.
  loading_message: "Cargando las preguntas..."
  network_error_message: "No hemos podido conectar con el servicio de preguntas. Comprueba que esté en marcha y accesible, y vuelve a intentarlo."
  retry_button: "Reintentar"
  cta_button: "Ver mi resultado"
  retake_button: "Hacer otro quiz"
  error_message: "Responde a todas las preguntas antes de ver tu resultado."
  overall_heading: "Tu puntuación general"
  layers_heading: "Capa por capa"
  layers:
    - id: cpu
      tag: CPU
      name: "Foco, memoria y ejecución"
      low:
        label: "Frágil"
        text: "Has fallado la mayoría de las preguntas de CPU — los capítulos sobre cambio de tarea, memoria, organización de procesos y aprendizaje probablemente todavía no son hábitos instalados. Es justo lo que cubren la Parte I del libro y el 1:1 Engineering Leader Program."
      mid:
        label: "En desarrollo"
        text: "Has acertado algunas preguntas de CPU, pero hay huecos reales en cómo el libro plantea la memoria, la priorización o el aprendizaje. Una relectura de la Parte I — o una sesión del Leader Program — cerraría esto rápido."
      high:
        label: "Sólida"
        text: "Dominas esta capa: el coste de cambiar de tarea, las técnicas de memoria y cómo el libro estructura el proceso personal te resultan naturales. Esa base es la que hace sostenibles las capas superiores."
      service_label: "1:1 Engineering Leader Program"
      service_url: "/es/services/#leader-program"
    - id: lan
      tag: LAN
      name: "Salud del equipo"
      low:
        label: "Frágil"
        text: "La mayoría de las preguntas de LAN te han pillado desprevenido — los modelos del libro sobre roles de equipo, planes de carrera y gestión de equipos (las cinco disfunciones, chequeos de salud, feedback) todavía no han calado. Es justo lo que el LAN Audit está pensado para trabajar con tu equipo real, no solo con el libro."
      mid:
        label: "En desarrollo"
        text: "Tienes claras las bases de los capítulos de LAN, pero se te han escapado algunos detalles — arquetipos de rol, nivelación o mecánica de salud de equipo. Merece una relectura, o una sesión de LAN Audit enfocada en tu equipo."
      high:
        label: "Sólida"
        text: "Dominas bien los modelos del libro sobre gestión de equipos — roles, planes de carrera y la mecánica de la salud de equipo. El siguiente paso es aplicar ese dominio a los puntos ciegos concretos de tu equipo."
      service_label: "LAN Audit — Evaluación de salud del equipo"
      service_url: "/es/services/#lan-audit"
    - id: wan
      tag: WAN
      name: "Stakeholders y organización"
      low:
        label: "Frágil"
        text: "Las preguntas de WAN han sido las más difíciles para ti — el mapa de stakeholders, las dependencias entre equipos y la gestión hacia arriba se cubren en detalle en la Parte III, y merece la pena repasarlos antes de confiar en ellos por instinto."
      mid:
        label: "En desarrollo"
        text: "Has captado parte del material de WAN, pero no todo — se te han escapado detalles de dependencias o de mapeo de stakeholders. Una segunda pasada por la Parte III, o un Diagnóstico de equipo y liderazgo, cerraría el hueco."
      high:
        label: "Sólida"
        text: "Dominas claramente cómo el libro estructura la gestión de stakeholders, las dependencias y la comunicación hacia arriba. Es la capa que más líderes se saltan — tú no."
      service_label: "Diagnóstico de equipo y liderazgo"
      service_url: "/es/services/#team-diagnosis"
  overall:
    low:
      label: "Toca releer"
      text: "Ahora mismo conoces menos del modelo del libro de lo que asume el quiz — y no pasa nada, para eso está una relectura (o el programa 1:1). Empieza por la capa que ha puntuado más bajo; suele ser donde está el hueco de mayor impacto."
    mid:
      label: "Buen dominio, huecos reales"
      text: "Conoces el libro con claridad — te has perdido detalles, no las ideas centrales. La capa con la puntuación más baja merece un vistazo antes de confiar en ella bajo presión."
    high:
      label: "Memoria afilada"
      text: "Dominas bien este contenido. A este nivel, el movimiento de mayor impacto no es releer — es aplicarlo a tu equipo y organización reales, que es exactamente para lo que están los servicios de abajo."
  final_cta:
    text: "La capa con la puntuación más baja merece un segundo vistazo antes de que te cueste caro en una situación real — hablemos de la forma más rápida de cerrar ese hueco."
    button: "Reserva una llamada introductoria gratuita de 30 min →"
    url: "/es/contact/"
