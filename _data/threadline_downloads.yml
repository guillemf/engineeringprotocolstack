# Threadline release download counts.
#
# GENERATED FILE — do not edit by hand. Overwritten by
# .github/scripts/update_download_counts.py, which reads the GitHub Releases
# API for the repository named in `threadline.releases_repo` in _config.yml.
#
# It is committed rather than fetched in the browser on purpose: the counts do
# not need to be live, and a build-time value keeps the number in the HTML
# instead of adding a request to api.github.com on every visit to the download
# page.
#
# Whether the number is rendered at all is decided by
# `threadline.downloads_min_display` in _config.yml, not by this file.

# When the counts below were read, UTC.
updated: "2026-11-18T15:34:16Z"

# Every asset of every published, non-draft, non-prerelease release added
# together. This is the number the page shows: it answers "how many times has
# Threadline been downloaded", which is the only question a visitor is asking.
total: 53

# How many published releases those downloads are spread across.
releases: 4

# The newest published release's version and installer filenames, which the
# download buttons use so the links follow each release without a config edit.
# Filenames are matched to platform ids by suffix (see PLATFORM_SUFFIXES in the
# script); a platform with no matching asset is omitted and the button falls
# back to the filename in _config.yml.
version: "1.0.1"
files:
  macos_arm: "Threadline_1.0.1_aarch64.dmg"
  macos_intel: "Threadline_1.0.1_x64.dmg"
  windows: "Threadline_1.0.1_x64-setup.exe"
  linux_appimage: "Threadline_1.0.1_amd64.AppImage"
  linux_deb: "Threadline_1.0.1_amd64.deb"
  linux_rpm: "Threadline-1.0.1-1.x86_64.rpm"

# The newest published release on its own. Not currently rendered — it is here
# because it resets to near zero on every version bump, which makes it the
# wrong number for social proof and the right one for judging whether a release
# is being picked up.
latest:
  tag: "v1.0.1"
  total: 9
