{% assign lang = page.lang | default: site.default_lang %}
{% assign a = site.data.assessment[lang] %}

<div class="assessment" id="assessment-root">
  <p id="assessment-loading" class="assessment-status">{{ a.loading_message }}</p>

  <div id="assessment-network-error" class="assessment-status assessment-status--error" hidden>
    <p>{{ a.network_error_message }}</p>
    <button type="button" id="assessment-retry" class="btn btn-outline">{{ a.retry_button }}</button>
  </div>

  <form id="assessment-form" class="assessment-form" novalidate hidden>
    <div id="assessment-questions"></div>

    <p id="assessment-error" class="assessment-error" hidden>{{ a.error_message }}</p>

    <button type="submit" class="btn btn-primary">{{ a.cta_button }}</button>
  </form>

  <div id="assessment-results" class="assessment-results" hidden></div>

  <button type="button" id="assessment-retake" class="btn btn-outline assessment-retake" hidden>{{ a.retake_button }}</button>
</div>

<script id="assessment-data" type="application/json">
{
  "lang": {{ lang | jsonify }},
  "overallHeading": {{ a.overall_heading | jsonify }},
  "layersHeading": {{ a.layers_heading | jsonify }},
  "errorMessage": {{ a.error_message | jsonify }},
  "layers": [
    {% for layer in a.layers %}
    {
      "id": {{ layer.id | jsonify }},
      "tag": {{ layer.tag | jsonify }},
      "name": {{ layer.name | jsonify }},
      "low": {{ layer.low | jsonify }},
      "mid": {{ layer.mid | jsonify }},
      "high": {{ layer.high | jsonify }},
      "service_label": {{ layer.service_label | jsonify }},
      "service_url": {{ layer.service_url | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ],
  "overall": {{ a.overall | jsonify }},
  "final_cta": {{ a.final_cta | jsonify }}
}
</script>
<script>
  window.SITE_BASEURL = {{ site.baseurl | jsonify }};
  window.EPS_ASSESSMENT_SERVICE_BASE_URL = {{ site.assessment_service.base_url | jsonify }};
</script>
<script src="{{ '/assets/js/assessment.js' | relative_url }}" defer></script>
